# Importa as variáveis de ambiente do arquivo .env
spring.config.import=optional:file:.env[.properties]

# Variável da url do BD
spring.datasource.url=${DB_URL}

# Variável da User name
spring.datasource.username=${DB_USERNAME}

# Variável da senha do banco de dados
spring.datasource.password=${DB_PASSWORD}

# variável do login
healthhub.admin.login=${ADMIN_LOGIN:}

# Variável da senha do login
healthhub.admin.password=${ADMIN_PASSWORD:}

# Capacidade máxima do tamanho da imagem
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
