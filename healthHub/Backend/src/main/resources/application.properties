# Conexão com Mysql hospedado no Aiven #


# Endereço do banco de dados e nome do banco, usuário e senha
spring.datasource.url=jdbc:mysql://localhost:3306/healthhub?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password

# Configurações do hibernate 

# valida a estrutura do banco de dados com base nas entidades mapeadas, sem alterar o banco de dados
spring.jpa.hibernate.ddl-auto=validate  

# Exibe as consultas SQL geradas pelo Hibernate no console
spring.jpa.show-sql=true

# Porta HTTP do servidor web
server.port=8080

# desativa a configuração automática do Spring Boot para o DataSource e Hibernate JPA
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration