<form class="formulario" id="formulario-login">

    <h2 class="formulario__titulo">
        Entrar no sistema
    </h2>

    <p class="formulario__descricao">
        Informe o login e a senha fornecidos pelo hospital.
    </p>

    <div class="campo__controle">

        <label class="campo__label" for="login">
            Login
        </label>

        <div class="campo__entrada">

            <input class="campo__input" type="email" id="login" name="login" placeholder="seuemail@hospital.com" autocomplete="username" required>

        </div>

    </div>

    <div class="campo__controle">

        <label class="campo__label" for="senha">
            Senha
        </label>

        <div class="campo__entrada">

            <input class="campo__input" type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>

        </div>

    </div>

    <div class="login__opcoes">

        <label class="lembrar-login">

            <input type="checkbox" name="lembrar">

            Lembrar de mim

        </label>

        <a href="#" class="link-esqueci-senha">
            Esqueci minha senha
        </a>

    </div>

    <div class="login__botoes">

        <button type="submit" class="botao-entrar">
            Entrar

            <img src="../../CSS/1-Login.css/assets/icones/seta-entrar.svg" alt="">
        </button>

        <a href="../Cadastro/index.html" class="botao-cadastrar">
            Cadastrar hospital
        </a>

    </div>

    <p id="mensagem-login" class="mensagem" role="alert"></p>

</form>
