<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthHub</title>
    <link rel="icon" type="image/svg" href="../CSS/1-Login.css/assets/logo/simbolo.svg">
</head>


<body class="body-login">

    <!--Componente principal-->
    <main>
        <!-- Conteúdo principal e imagem lateral -->
        <div>

            <header class="logo-principal">

                <img src="../CSS/1-Login.css/assets/logo/logo-principal.svg" alt="Logo HealthHub">
        
            </header>


            <div class="perfis-usuario">

                <p class="subtitulo">Selecione seu perfil</p>

                <div>
                    <img src="../CSS/1-Login.css/assets/icones/recepcao.svg"/>
                    <p>Recepção</p>
                </div>


                <div>
                    <img src="../CSS/1-Login.css/assets/icones/medico.svg"/>
                    <p>Médico</p>
                </div>


                <div>
                    <img src="../CSS/1-Login.css/assets/icones/paciente.svg"/>
                    <p>Paciente</p>
                </div>


            </div>

            <!-- Formulário de Login -->
            <form class="formulario-login">

                
                <div class="label-input">
                    <label class="label" for="email">Email</label>
                    <input class="input" type="email" id="email" name="email" required>
                </div>

                <div class="label-input">
                    <label class="label" for="password">Senha</label>
                    <input class="input" type="password" id="password" name="password" required>
                </div>

                <div>
                    <button type="submit" class="botao-entrar">Entrar</button>
                    <button class="botao-cadastrar" type="button">Cadastrar</button>


                </div>
                
                <!--Bloco informacional-->
                <div>
                    <img src="..\CSS\1-Login.css\assets\icones\informacao.svg"/>
                    <p><strong>Cada perfil possui um painel exclusivo</strong></p>
                    <p>Após o login, você terá acesso a um painel personalizado com todas as funcionalidades disponíveis.</p>

                </div>



            </form>

        </div>

        <footer class="rodape">
            <img src=""/>
            <p class="link-rodape">Sobre</p>
            <p class="link-rodape">Funcionalidades</p>
            <p class="link-rodape">Segurança</p>
            <p class="link-rodape">Contato</p>   
        </footer>



    </main>


    <!--Imagem lateral-->

    <div>
        <img src="..\CSS\1-Login.css\assets\imagem\recepcao.svg"/>
    </div>




    
</body>



</html>
