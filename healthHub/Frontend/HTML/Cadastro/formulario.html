<form class="formulario" id="formulario">
                  <!-- E-mail -->
                <div class="campo__controle">

                    <label class="campo__label" for="email">
                        CNPJ
                    </label>

                    <div class="campo__entrada">

                        <img
                            src="../../CSS/1-Login.css/assets/icones/email.svg"
                            alt=""
                            class="campo__icone"
                        >

                        <input
                            class="campo__input"
                            type="text"
                            id="cnpj"
                            name="cnpj"
                            placeholder="00.000.000./0000-00"
                            required
                        >

                    </div>
                </div>

                <!-- Senha -->
                <div class="campo__controle">

                    <label class="campo__label" for="password">
                        Crie uma senha
                    </label>

                    <div class="campo__entrada">

                        <img
                            src="../../CSS/1-Login.css/assets/icones/senha.svg"
                            alt=""
                            class="campo__icone"
                        >

                        <input
                            class="campo__input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="crie uma senha"
                            autocomplete="current-password"
                            required
                        >

                        <img
                            src="../../CSS/1-Login.css/assets/icones/ocultar-senha.svg"
                            alt=""
                            class="campo_icone"
                        >

                    </div>
                </div>




            </form>

<!-- Carrega o JS original depois do formulário. -->
