<section class="cadastro-paciente">

    <header>
        <h1>CADASTRAR PACIENTE</h1>
        <p>Cadastre um novo paciente no sistema.</p>
    </header>

    <form id="formulario-paciente">

        <div>
            <label for="paciente-nome">Nome completo:</label>
            <input
                type="text"
                id="paciente-nome"
                name="nome"
                placeholder="Digite o nome completo"
                autocomplete="name"
                maxlength="160"
                required
            >
        </div>

        <div>
            <label for="paciente-email">Email:</label>
            <input
                type="email"
                id="paciente-email"
                name="login"
                placeholder="exemplo@email.com"
                autocomplete="email"
                required
            >
        </div>

        <div>
            <label for="paciente-cpf">CPF:</label>
            <input
                type="text"
                id="paciente-cpf"
                name="cpf"
                placeholder="000.000.000-00"
                inputmode="numeric"
                maxlength="14"
                autocomplete="off"
                required
            >
        </div>

        <div>
            <label for="paciente-nascimento">Nascimento:</label>
            <input
                type="date"
                id="paciente-nascimento"
                name="nascimento"
                autocomplete="bday"
                required
            >
        </div>

        <div>
            <label for="paciente-telefone">Telefone:</label>
            <input
                type="tel"
                id="paciente-telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                autocomplete="tel"
                maxlength="15"
                required
            >
        </div>

        <div>
            <label for="paciente-senha">Senha inicial:</label>
            <input
                type="password"
                id="paciente-senha"
                name="senha"
                minlength="8"
                autocomplete="new-password"
                required
            >
        </div>

        <div>
            <label for="foto-paciente">Foto:</label>
            <input
                type="file"
                id="foto-paciente"
                name="foto"
                accept="image/jpeg,image/png,image/webp"
            >
        </div>

        <button type="submit">
            Cadastrar paciente
        </button>

        <p id="mensagem-paciente" role="alert"></p>
    </form>

</section>
