<section class="cadastro-medico">

    <header>
        <h1>CADASTRAR MÉDICO</h1>
        <p>Cadastre o profissional e defina o acesso inicial.</p>
    </header>

    <form id="form-medico">

        <div>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" autocomplete="name" maxlength="160" required>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com" autocomplete="email" required>
        </div>

        <div>
            <label for="crm">CRM:</label>
            <input type="text" id="crm" name="crm" placeholder="Digite o CRM" required>
        </div>

        <div>
            <label for="especialidade">Especialidade:</label>
            <select id="especialidade" name="especialidade" required>
                <option value="" disabled selected>
                    Selecione uma especialidade
                </option>
                <option value="GERAL">Clínico Geral</option>
                <option value="CARDIOLOGISTA">Cardiologista</option>
                <option value="REUMATOLOGISTA">Reumatologista</option>
                <option value="DERMATOLOGISTA">Dermatologista</option>
                <option value="PSIQUIATRA">Psiquiatra</option>
                <option value="UROLOGISTA">Urologista</option>
            </select>
        </div>

        <div>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite a senha inicial" autocomplete="new-password" minlength="8" required>
        </div>

        <button type="submit">
            Cadastrar médico
        </button>

    </form>

</section>
